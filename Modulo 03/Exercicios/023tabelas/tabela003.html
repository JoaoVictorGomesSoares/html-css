<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        :root {
            --branca: #f0f0f0;
            --clara: #d0d0d0;
            --escura: #383838;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background-color: var(--branca);
        }

        table {
            border-collapse: collapse;
            width: 350px;
            height: 350px;
        }
        td {
            border: 1px var(--escura) solid;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1> Mesclagem de Células </h1>

    <table>
        <tr>
            <td colspan="3">→</td>
            <td rowspan="3">↓</td>
        </tr>
        <tr>
            <td rowspan="3">↑</td>
            <td>↱</td>
            <td>↴</td>
        </tr>
        <tr>
            <td>⬑</td>
            <td>↵</td>
        </tr>
        <tr>
            <td colspan="3">←</td>
        </tr>
    </table>
</body>
</html>
