<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        td {
            border: 1px black solid;

            padding: 8px;

            width: 100px;
            height: 100px;

            text-align: center;
            vertical-align: middle;
        }
        .a-direita {
            text-align: right;
        }
        .a-esquerda {
            text-align: left;
        }
        .a-cima {
            vertical-align: top;
        }
        .a-baixo {
            vertical-align: bottom;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr><!-- Table Row, linha da tabela -->
            <td>A1</td><!-- Table Data, Contúdo da linha -->
            <td class="a-cima">B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td class="a-esquerda">A2</td>
            <td>B2</td>
            <td class="a-direita">C3</td>
        </tr>
        <tr>
            <td>A3</td>
            <td class="a-baixo">B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td class="a-esquerda">A4</td>
            <td class="a-baixo">B4</td>
            <td class="a-direita">C4</td>
        </tr>
    </table>
</body>
</html>
