<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>

    <style>
        /*declarações Gerais*/
        @charset "UTF-8";

        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --azulCursoemVideo: #233eff;
            --corDaSombra: #101c77;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--azulCursoemVideo);
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 0px var(--corDaSombra);
            padding: 10px;
        }

        /*declarações Retatro*/
        @media  screen and (orientation: portrait) {
            body {
                background: url(../imagens/cev-portrait.jpg);
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center bottom;
            }
        }

        /*declarações Paisagem*/
        @media screen and (orientation: landscape) {
            body {
                background: url(../imagens/cev-landscape.jpg);
                background-size: contain;
                background-repeat: no-repeat;
                background-position: left bottom;
            }
        }
    </style>

</head>
<body>
    <h1>Mude a orientação do seu Dispositivo!</h1>
</body>
</html>
